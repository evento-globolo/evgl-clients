[package]
org = "evento-globolo"
name = "evgl-clients"
version = "0.1.0"
description = "Polyglot SDK clients for Evento Globolo"
license = "MIT"
keywords = ["clients", "sdk", "polyglot", "openapi"]

[package.repository]
vcs = "git"
url = "https://github.com/evento-globolo/evgl-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"evento-globolo/evgl-interfaces" = "^0.1.0"
"evento-globolo/evgl-libs" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "build/**", ".build/**", "*.log", ".vendor/.zed/**"]

[scripts]
test = "bash scripts/test.sh"
validate-layout = "bash scripts/validate-client-layout.sh"
verify-matrix = "node scripts/verify-client-matrix.mjs"

[targets.repository]
dir = "."
name = "evgl-clients-repository"

# TypeScript is the Node.js Zed target. Deno, Bun, and edge remain explicit
# runtime entry points inside this package rather than unsupported Zed targets.
[targets.nodejs]
dir = "clients/typescript"
name = "evgl-clients-typescript"
adapter = "node"

[targets.golang]
dir = "clients/go"
adapter = "go"

[targets.python]
dir = "clients/python"
adapter = "python"

[targets.ruby]
dir = "clients/ruby"

[targets.php]
dir = "clients/php"

[targets.rust]
dir = "clients/rust"
adapter = "rust"

[targets.rust-wasm]
dir = "clients/wasm"
adapter = "node"

[targets.dart]
dir = "clients/dart"
adapter = "dart"

[targets.gleam]
dir = "clients/gleam"

[targets.erlang]
dir = "clients/erlang"

[targets.elixir]
dir = "clients/elixir"

[targets.java]
dir = "clients/java"
adapter = "java"

[targets.kotlin]
dir = "clients/kotlin"
adapter = "java"

[targets.swift]
dir = "clients/swift"
