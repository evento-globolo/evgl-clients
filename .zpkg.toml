[package]
org = "evento-globolo"
name = "evgl-clients"
version = "0.1.0"
description = "Polyglot SDK clients for Evento Globolo"
license = "MIT"
language = "polyglot"

[package.repository]
vcs = "git"
url = "https://github.com/evento-globolo/evgl-clients"

[install]
dir = ".vendor/.zed"

[dependencies]
"evento-globolo/evgl-interfaces" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log", ".vendor/.zed/**"]

[scripts]
test = "bash scripts/test.sh"
