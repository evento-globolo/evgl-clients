[package]
name = "evgl-client"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
evgl-domain = { git = "https://github.com/evento-globolo/evgl-libs", branch = "main" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde"] }
