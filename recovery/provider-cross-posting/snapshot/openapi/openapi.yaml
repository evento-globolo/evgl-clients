openapi: 3.1.0
info:
  title: Evento Globolo API
  version: 0.1.0
servers:
  - url: https://api.example.invalid
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status:
          const: ok
        service:
          type: string
